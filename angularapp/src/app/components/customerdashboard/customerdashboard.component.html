<div class="page">

  <div class="form-card">

    <div class="page-badge">
      Welcome
    </div>

    <h2>Complete Your Profile</h2>

    <p class="lead">
      Tell us a little about yourself so we can personalize your learning experience.
    </p>

    <form
      [formGroup]="detailsForm"
      (ngSubmit)="onSubmit()"
      novalidate>

      <mat-form-field appearance="outline">

        <mat-label>Full Name</mat-label>

        <mat-icon matPrefix>
          person
        </mat-icon>

        <input
          matInput
          id="customerName"
          type="text"
          formControlName="customerName">

        <mat-error *ngIf="f['customerName'].errors?.['required']">
          Name is required
        </mat-error>

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>
          Tell us about yourself
        </mat-label>

        <mat-icon matPrefix>
          school
        </mat-icon>

        <textarea
          matInput
          rows="5"
          id="information"
          formControlName="information"
          placeholder="Example: Final year Computer Science student interested in web development and cloud computing">
        </textarea>

        <mat-error *ngIf="f['information'].errors?.['required']">
          This field is required
        </mat-error>

      </mat-form-field>

      <div
        class="form-error"
        role="alert"
        *ngIf="errorMessage">

        <mat-icon>
          error_outline
        </mat-icon>

        {{ errorMessage }}

      </div>

      <div class="form-actions">

        <button
          mat-flat-button
          color="primary"
          type="submit"
          id="submitDetails"
          [disabled]="detailsForm.invalid || loading">

          <mat-icon>
            check_circle
          </mat-icon>

          {{ loading ? 'Saving...' : 'Save & Continue' }}

        </button>

      </div>

    </form>

  </div>

</div>
